# ==========================================================
#  Ρυθμίσεις του συστήματος αναζήτησης (κοινές για τα 5 apps)
#  Κάθε τιμή μπορεί να αλλάξει και από τη γραμμή εντολών:
#     java -Dserver.port=6000 ...
# ==========================================================

# --- Δεδομένα (ΕΚΤΟΣ του φακέλου του project / OneDrive) ---
# Τα 10.000 PDF του arXiv (είσοδος App 1)
pdf.dir=C:/IR_data/arxiv_papers
# Το Repository: repo_00000.jsonl, ... (έξοδος App 1, είσοδος App 2)
repo.dir=C:/IR_data/repository
# Το αντεστραμμένο ευρετήριο της Lucene (έξοδος App 2, είσοδος App 3)
index.dir=C:/IR_data/index

# --- App 1: Store Module ---
# Μέγιστο μέγεθος κάθε αρχείου του repository (MB). Ένα άρθρο δεν σπάει ποτέ σε 2 αρχεία.
repo.max.file.mb=128
# Πόσα threads εξάγουν κείμενο από PDF ταυτόχρονα (σχόλιο = αυτόματα: πυρήνες - 1)
#store.threads=4

# --- App 3: Query Server ---
server.host=127.0.0.1
server.port=5555
# Ανώτατο maxResults που δέχεται ο server σε ένα request
server.max.results=100
# Τελεστής ανάμεσα σε λέξεις χωρίς AND/OR: OR (κατάταξη BM25) ή AND (πιο αυστηρό)
server.default.operator=OR

# --- App 4: Query Client ---
client.timeout.ms=30000

# --- App 5: Search Interface ---
ui.port=8080
ui.results.per.page=10
